name: Weekly creator radar

on:
  schedule:
    # Every Monday, 13:17 UTC (early morning in Los Angeles). GitHub drops or delays runs set for the top of
    # the hour when it is busy, so this runs a few minutes after.
    - cron: "17 13 * * 1"
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m core.radar --out reports
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit the report
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          git add reports
          git commit -m "Creator radar report $(date +%F)" || echo "nothing to commit"
          git push
